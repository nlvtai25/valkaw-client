plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

def valkawVariant = (project.findProperty("valkaw_variant") ?: "sodium").toString()

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs '--width', '1280', '--height', '720'
		}
	}
	enableTransitiveAccessWideners = false

	mods {
		"valkawclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Jar-in-jar: one client jar carries its own dependencies.
	include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Shared optimization mods. Tick/network/RAM only; no renderer conflicts.
	[
		"maven.modrinth:dynamic-fps:3.11.6",
		"maven.modrinth:lithium:mc1.21.11-0.21.4-fabric",
		"maven.modrinth:ferrite-core:8.2.0-fabric",
		"maven.modrinth:krypton:0.2.10",
		"maven.modrinth:badoptimizations:2.4.1",
		"maven.modrinth:clumps:29.0.0.1",
		"maven.modrinth:c2me-fabric:0.4.0-alpha.0.28+1.21.11",
	].each { include it }

	// `include` nests a mod inside the shipped jar. Only the core renderer also goes on
	// the dev runtime classpath: the satellite mods (sodium-extra, fzzy-config, ...)
	// pull dependencies that the dev runtime cannot resolve, so `runClient` would crash
	// before it ever draws a frame.
	if (valkawVariant == "vulkan") {
		[
			"maven.modrinth:vulkanmod:0.6.8+1.21.11",
			"maven.modrinth:not-enough-vulkan:1.6.2+1.21.11",
		].each { include it }
		modRuntimeOnly "maven.modrinth:vulkanmod:0.6.8+1.21.11"
		// Fabric only loads the jars nested inside a mod when it is installed from a
		// mods folder, not from the dev classpath, so the Vulkan bindings VulkanMod
		// normally injects are missing in `runClient`. Same jars, taken from its
		// META-INF/jars and put on the dev runtime directly.
		runtimeOnly files(
				"libs/lwjgl-vulkan-3.3.3.jar",
				"libs/lwjgl-vma-3.3.3.jar",
				"libs/lwjgl-vma-3.3.3-natives-linux.jar",
				"libs/lwjgl-shaderc-3.3.3.jar",
				"libs/lwjgl-shaderc-3.3.3-natives-linux.jar")
	} else {
		[
			"maven.modrinth:sodium:mc1.21.11-0.8.15-beta.1-fabric",
			"maven.modrinth:sodium-extra:mc1.21.11-0.9.6-beta.1+fabric",
			"maven.modrinth:reeses-sodium-options:mc1.21.11-2.2.6-beta.1+fabric",
			"maven.modrinth:immediatelyfast:1.14.3+1.21.11-fabric",
			"maven.modrinth:moreculling:1.6.2",
			"maven.modrinth:cloth-config:21.11.153+fabric",
			"maven.modrinth:particle-core:0.3.2+1.21.11",
			"maven.modrinth:fzzy-config:0.7.7+1.21.11",
			"maven.modrinth:fabric-language-kotlin:1.14.2+kotlin.2.4.21",
		].each { include it }
		modRuntimeOnly "maven.modrinth:sodium:mc1.21.11-0.8.15-beta.1-fabric"
	}
}

// Mods Modrinth's Maven can't serve (bad metadata) or that ship outside the Maven list.
// Nested into the client jar after remapping so one jar carries everything.
def valkawExtras = (valkawVariant == "vulkan" ? [
	"greedy-meshing-0.6.1+1.21.11.jar",
	"lambdynamiclights-4.9.1+1.21.11.jar",
	"ImmediatelyFast-Fabric-1.14.3+1.21.11.jar",
	"offlinemodefix-1.1.0+1.21.11.jar",
	"rpc-1.2.4+1.20.3-1.21.11-fabric.jar",
] : [
	"entityculling-fabric-1.11.3-mc1.21.11.jar",
	"greedy-meshing-0.6.1+1.21.11.jar",
	"lambdynamiclights-4.9.1+1.21.11.jar",
	"sodiumfpscapfix-fabric-1.21.11-1.0.37.jar",
	"offlinemodefix-1.1.0+1.21.11.jar",
	"rpc-1.2.4+1.20.3-1.21.11-fabric.jar",
])

tasks.named("remapJar") {
	archiveClassifier = valkawVariant
	notCompatibleWithConfigurationCache("Loom nested jar generation")
	doLast {
		def out = archiveFile.get().asFile
		def extras = valkawExtras.collect { new File(projectDir, "libs/" + it) }
		extras.each { if (!it.exists()) throw new GradleException("missing nested mod: " + it) }
		def tmp = new File(out.parentFile, out.name + ".tmp")
		def zin = new java.util.zip.ZipInputStream(new FileInputStream(out))
		def zout = new java.util.zip.ZipOutputStream(new FileOutputStream(tmp))
		def entry
		while ((entry = zin.nextEntry) != null) {
			byte[] data = zin.readAllBytes()
			if (entry.name == "fabric.mod.json") {
				def json = new groovy.json.JsonSlurper().parseText(new String(data, "UTF-8"))
				json.jars = (json.jars ?: []) + extras.collect { [file: "META-INF/jars/" + it.name] }
				data = new groovy.json.JsonOutput().toJson(json).getBytes("UTF-8")
			}
			zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
			zout.write(data)
			zout.closeEntry()
		}
		extras.each {
			zout.putNextEntry(new java.util.zip.ZipEntry("META-INF/jars/" + it.name))
			zout.write(it.bytes)
			zout.closeEntry()
		}
		zin.close()
		zout.close()
		if (!tmp.renameTo(out)) {
			out.delete()
			tmp.renameTo(out)
		}
	}
}
tasks.matching { it.name == "processIncludeJars" }.configureEach {
	notCompatibleWithConfigurationCache("Loom nested jar generation")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

def modVersion = project.version
processResources {
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
