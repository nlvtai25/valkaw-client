plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

def valkawVariant = (project.findProperty("valkaw_variant") ?: "sodium").toString()

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs '--width', '1280', '--height', '720'
		}
	}
	enableTransitiveAccessWideners = false

	mods {
		"valkawclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.x client jars ship unobfuscated (Mojang dropped client_mappings), so
	// there is no mojang mappings layer to apply — compiling directly against
	// the named jar. Do NOT re-add officialMojangMappings() here.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Jar-in-jar: one client jar carries its own dependencies.
	include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Shared optimization mods. Tick/network/RAM only; no renderer conflicts.
	// Modrinth version IDs are used where the human version string is shared across MC/loader builds.
	[
		"maven.modrinth:dynamic-fps:HV67Kt1R",
		"maven.modrinth:lithium:Oqq8TOAV",
		"maven.modrinth:ferrite-core:d5ddUdiB",
		"maven.modrinth:krypton:kYAGItyj",
		"maven.modrinth:badoptimizations:gjIvugXc",
		"maven.modrinth:clumps:RXNrUIjA",
		"maven.modrinth:c2me-fabric:W9TlypeQ",
		"maven.modrinth:scalablelux:ToW8oIIq",
		"maven.modrinth:vmp-fabric:9f7J0dAp",
		"maven.modrinth:modernfix-mvus:cTKaCklf",
		"maven.modrinth:ixeris:1vSrvRGQ",
		"maven.modrinth:immediatelyfast:xOA9hbpf",
		"maven.modrinth:particle-core:EkGqhJyz",
		"maven.modrinth:fastquit:ly8rADfr",
		"maven.modrinth:ksyxis:kzLBJQLn",
		"maven.modrinth:resourcepackcached:IM1rEA8n",
		"maven.modrinth:offline-mode-fix:DrArOlIS",
		"maven.modrinth:cloth-config:GFM8zh9J",
		"maven.modrinth:fzzy-config:Ugxie86a",
		"maven.modrinth:fabric-language-kotlin:SKW1BTL3",
	].each { include it }

	// `include` nests a mod inside the shipped jar. Only the core renderer also goes on
	// the dev runtime classpath: the satellite mods (sodium-extra, fzzy-config, ...)
	// pull dependencies that the dev runtime cannot resolve, so `runClient` would crash
	// before it ever draws a frame.
	if (valkawVariant == "vulkan") {
		// VulkanMod 26.1.2 is nested via valkawExtras below (local jar), and put on the
		// dev classpath directly.
		implementation files("libs/VulkanMod-0.6.8+26.1.2.jar")
		// Fabric only loads the jars nested inside a mod when it is installed from a
		// mods folder, not from the dev classpath, so the Vulkan bindings VulkanMod
		// normally injects are missing in `runClient`. Same jars, taken from its
		// META-INF/jars and put on the dev runtime directly.
		runtimeOnly files(
				"libs/lwjgl-vulkan-3.4.1.jar",
				"libs/lwjgl-vma-3.4.1.jar",
				"libs/lwjgl-vma-3.4.1-natives-linux.jar",
				"libs/lwjgl-shaderc-3.4.1.jar",
				"libs/lwjgl-shaderc-3.4.1-natives-linux.jar")
	} else {
		[
			"maven.modrinth:sodium:tZQ3jqnf",
			"maven.modrinth:sodium-extra:nP6HUWD1",
			"maven.modrinth:reeses-sodium-options:CqmgNDX3",
			"maven.modrinth:moreculling:hS47fcKO",
			"maven.modrinth:chunks-fade-in:nplKyF0A",
			"maven.modrinth:better-block-entities:n78M7IgQ",
			"maven.modrinth:nvidium:VqbIfKxa",
		].each { include it }
		implementation "maven.modrinth:sodium:tZQ3jqnf"
	}
}

// Mods Modrinth's Maven can't serve (bad metadata) or that ship outside the Maven list.
// Nested into the client jar so one jar carries everything.
def valkawExtras = (valkawVariant == "vulkan" ? [
	"VulkanMod-0.6.8+26.1.2.jar",
	"not-enough-vulkan-fabric-1.6.2+mc26.1.1.jar",
	"entityculling-fabric-1.11.3-mc26.1.jar",
	"lambdynamiclights-4.11.2+26.1.2.jar",
	"lightweight-inventory-sorting-1.1.7+26.1.jar",
	"shulkerboxtooltip-fabric-5.4.3+26.1.1.jar",
] : [
	"entityculling-fabric-1.11.3-mc26.1.jar",
	"lambdynamiclights-4.11.2+26.1.2.jar",
	"sodiumfpscapfix-fabric-26.1.2-1.0.37.jar",
	"lightweight-inventory-sorting-1.1.7+26.1.jar",
	"shulkerboxtooltip-fabric-5.4.3+26.1.1.jar",
])

// 26.x client jars ship unobfuscated, so there is no remap step and no
// `remapJar` task — the plain `jar` task produces the shippable artifact. The
// nested-mod logic therefore attaches to `jar` instead.
tasks.named("jar") {
	archiveClassifier = valkawVariant
	notCompatibleWithConfigurationCache("Loom nested jar generation")
	doLast {
		def out = archiveFile.get().asFile
		def extras = valkawExtras.collect { new File(projectDir, "libs/" + it) }
		extras.each { if (!it.exists()) throw new GradleException("missing nested mod: " + it) }
		def tmp = new File(out.parentFile, out.name + ".tmp")
		def zin = new java.util.zip.ZipInputStream(new FileInputStream(out))
		def zout = new java.util.zip.ZipOutputStream(new FileOutputStream(tmp))
		def entry
		while ((entry = zin.nextEntry) != null) {
			byte[] data = zin.readAllBytes()
			if (entry.name == "fabric.mod.json") {
				def json = new groovy.json.JsonSlurper().parseText(new String(data, "UTF-8"))
				json.jars = (json.jars ?: []) + extras.collect { [file: "META-INF/jars/" + it.name] }
				data = new groovy.json.JsonOutput().toJson(json).getBytes("UTF-8")
			}
			zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
			zout.write(data)
			zout.closeEntry()
		}
		extras.each {
			zout.putNextEntry(new java.util.zip.ZipEntry("META-INF/jars/" + it.name))
			zout.write(it.bytes)
			zout.closeEntry()
		}
		zin.close()
		zout.close()
		if (!tmp.renameTo(out)) {
			out.delete()
			tmp.renameTo(out)
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

def modVersion = project.version
processResources {
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
