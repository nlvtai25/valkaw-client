name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build client snapshots
        run: |
          chmod +x scripts/build-all.sh scripts/build-version.sh
          ./scripts/build-all.sh --clients

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: valkaw-launcher/frontend
      - name: go vet
        run: go vet ./...
        working-directory: valkaw-launcher
      - name: go test
        run: go test ./...
        working-directory: valkaw-launcher
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build launcher
        run: |
          export PATH="$HOME/go/bin:$PATH"
          cd valkaw-launcher && ./build.sh
      - name: Package artifact
        run: |
          VER=$(sed -n 's/.*launcherVersion = "\(.*\)"/\1/p' valkaw-launcher/main.go)
          cp valkaw-launcher/build/bin/valkaw-launcher "valkaw-launcher-$VER-linux-amd64"
      - name: Smoke test (headless)
        run: |
          sudo apt-get install -y xvfb xauth
          VER=$(sed -n 's/.*launcherVersion = "\(.*\)"/\1/p' valkaw-launcher/main.go)
          BIN="valkaw-launcher-$VER-linux-amd64"
          if ldd "$BIN" | grep -q 'not found'; then ldd "$BIN"; exit 1; fi
          # No display on the runner: run under Xvfb. Timeout 124 means it was
          # still up after 20s, i.e. the window and WebKit started fine.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
          code=0
          timeout 20 xvfb-run -a "./$BIN" || code=$?
          if [ "$code" != 124 ]; then echo "launcher exited early (code $code)"; exit 1; fi
          # Config is written to ~/.valkaw/launcher/config.json (see app.go launcherDir).
          grep -q "\"launcherVersion\": \"$VER\"" "$HOME/.valkaw/launcher/config.json"
      - uses: actions/upload-artifact@v4
        with:
          name: valkaw-launcher-linux-amd64
          path: valkaw-launcher-*-linux-amd64

  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build launcher
        shell: bash
        run: |
          export PATH="$HOME/go/bin:$PATH"
          cd valkaw-launcher-win && ./build.sh
      - name: Package artifact
        shell: bash
        run: |
          VER=$(sed -n 's/.*windowsVersion = "\(.*\)"/\1/p' valkaw-launcher-win/main.go)
          cp valkaw-launcher-win/build/bin/valkaw-launcher-win.exe "valkaw-launcher-win-$VER-windows-amd64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: valkaw-launcher-windows-amd64
          path: valkaw-launcher-win-*-windows-amd64.exe
  