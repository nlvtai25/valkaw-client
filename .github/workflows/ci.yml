name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build client snapshots
        run: |
          chmod +x scripts/build-version.sh
          ./scripts/build-version.sh 1.21.11 --profiles all
          ./scripts/build-version.sh 26.2 --profiles all
          ./scripts/build-version.sh 26.3 --profiles sodium

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: valkaw-launcher/frontend
      - name: go vet
        run: go vet ./...
        working-directory: valkaw-launcher
      - name: go test
        run: go test ./...
        working-directory: valkaw-launcher
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build launcher
        run: |
          export PATH="$HOME/go/bin:$PATH"
          cd valkaw-launcher && ./build.sh
  